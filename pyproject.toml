[project]
name = "tm-utilities"
version = "0.1.0"
description = "A Python utility library providing reusable service wrappers for MongoDB, SQL (ODBC), logging, and vector store operations."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Vidit Sood"},
    {name = "Rahul Sharma"},
    {name = "Anikait Kapoor"},
]
dependencies = [
    "chromadb",
    "langchain==0.3.0",
    "langchain-community==0.3.0",
    "langchain-text-splitters>=0.3.8",
    "pymongo>=4.17.0",
    "sentence-transformers>=5.5.1",
    "torch>=2.0.0",
]
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
